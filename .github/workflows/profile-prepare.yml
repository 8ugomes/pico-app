name: Prepare profile review
on:
  push:
    branches: [fix/profile-premium-heic]
    paths: [.github/workflows/profile-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == '8ugomes/pico-app' && github.ref == 'refs/heads/fix/profile-premium-heic'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-premium-heic
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate reproducible lockfile without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact heic-to@1.5.2
      - name: Commit only package manifest and generated lockfile
        run: |
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: lock heic-to 1.5.2 for local photo conversion'
            git push origin HEAD:refs/heads/fix/profile-premium-heic
          fi
