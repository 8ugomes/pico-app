name: Prepare cycle 10 dependency lock
on:
  push:
    branches: [cycle-10-profile]
    paths: [package.json, .github/workflows/cycle10-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/cycle-10-profile'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cycle-10-profile
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve the pinned decoder without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit only the generated lock without overwriting other changes
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: lock HEIC decoder dependency'
            git fetch origin cycle-10-profile
            git rebase origin/cycle-10-profile
            git push origin HEAD:cycle-10-profile
          fi
